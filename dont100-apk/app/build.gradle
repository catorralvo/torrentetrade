plugins {
    id 'com.android.application'
}

android {
    namespace 'game.dont100.test'
    compileSdk 36

    defaultConfig {
        applicationId 'game.dont100.gameplayfix'
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName '4.3.1-gameplayfix'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
